[project]
name = "aimacro"
version = "0.1.0"
description = "Implementation of Korinek, Jones, Sacher, Cotter & McCrory (2026), 'Economic Scenarios for Transformative AI'"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
aimacro = "aimacro.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimacro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
